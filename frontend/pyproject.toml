[project]
name = "rag-chatbot-app"
version = "0.1.0"
description = "APP simples de RAG com Streamlit"
authors = [
    {name = "eriktilio",email = "erikatiliorey@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
packages = [{ include = "src" }]
requires-python = ">=3.13"
dependencies = [
    "streamlit (>=1.51.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)"
]

[tool.poetry]
name = "rag-chatbot-app"
version = "0.1.0"
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
