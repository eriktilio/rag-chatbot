#version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend-rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/data
    environment:
      - POETRY_VIRTUALENVS_CREATE=false
      - PYTHONUNBUFFERED=1
    networks:
      - rag_network
    command: poetry run uvicorn src.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: frontend-rag-chatbot
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rag_network
    depends_on:
      - backend

networks:
  rag_network:
    driver: bridge
