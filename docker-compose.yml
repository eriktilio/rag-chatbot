services:
  backend:
    build: ./backend
    container_name: backend-rag-chatbot
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/data:/data
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rag_network
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: frontend-rag-chatbot
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - rag_network
    depends_on:
      - backend

networks:
  rag_network:
    driver: bridge