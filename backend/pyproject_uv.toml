[project]
name = "rag-chatbot-api"
version = "0.1.0"
description = "API simples de RAG com LangChain, HuggingFaceEmbeddings, FAISS e Gemini-Flash"
authors = [
    {name = "eriktilio",email = "erikatiliorey@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
packages = [{ include = "src" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "fastapi (>=0.121.0,<0.122.0)",
    "uvicorn[standard] (>=0.38.0,<0.39.0)",
    "langchain (>=1.0.4,<2.0.0)",
    "langchain-community (>=0.4.1,<0.5.0)",
    "sentence-transformers (>=5.1.2,<6.0.0)",
    "pypdf (>=6.1.3,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "faiss-cpu (>=1.12.0,<2.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "langchain-google-genai (>=3.0.1,<4.0.0)",
    "streamlit (>=1.51.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "torch (>=2.2.0,<3.0.0)",
    #"torchvision (>=0.17.0,<1.0.0)"
]

[tool.uv]
# Define um índice explícito para versões de CPU do PyTorch
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Força o uv a baixar torch e torchvision deste índice específico,
# mesmo que sejam dependências indiretas (trazidas pelo sentence-transformers)
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }